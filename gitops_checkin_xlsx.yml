---
- name: GitOps check-in for the VLAN spreadsheet
  # Expects these to already be set by the including playbook:
  #   xlsx_file, vlan_id, assignment, result (registered from the write task)
  #
  # Credentials come from the AAP credential type "Git Token and Accessories"
  # (id=37), which injects GITHUB_TOKEN / GIT_USERNAME / GIT_USER_EMAIL as
  # environment variables when attached to this Job Template - read here via
  # ansible_env, not as extra_vars. Requires gather_facts: true in the
  # including play so ansible_env is populated.
  when: result.changed | default(false)
  block:
    - name: Warn and skip check-in when no GitHub credentials are supplied
      ansible.builtin.debug:
        msg: >-
          Skipping git check-in: attach the "Git Token and Accessories"
          credential to this Job Template to commit and push this change.
      when: >-
        ansible_env.GITHUB_TOKEN | default('') == '' or
        ansible_env.GIT_USERNAME | default('') == '' or
        ansible_env.GIT_USER_EMAIL | default('') == ''

    - name: Commit and push the workbook change
      when: >-
        ansible_env.GITHUB_TOKEN | default('') != '' and
        ansible_env.GIT_USERNAME | default('') != '' and
        ansible_env.GIT_USER_EMAIL | default('') != ''
      block:
        - name: Set date_time variable
          ansible.builtin.set_fact:
            date_time: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

        - name: Set git identity for this commit
          ansible.builtin.command:
            cmd: "git config user.{{ item.key }} {{ item.value }}"
            chdir: "{{ playbook_dir }}"
          loop:
            - { key: "name", value: "{{ ansible_env.GIT_USERNAME }}" }
            - { key: "email", value: "{{ ansible_env.GIT_USER_EMAIL }}" }
          changed_when: false

        - name: Stage the updated VLAN workbook
          ansible.builtin.command:
            cmd: "git add {{ xlsx_file }}"
            chdir: "{{ playbook_dir }}"
          changed_when: false

        - name: Commit the VLAN workbook update
          ansible.builtin.command:
            cmd: >-
              git commit -m "VLAN {{ vlan_id }} assigned to {{ assignment }} ({{ date_time }})"
            chdir: "{{ playbook_dir }}"
          register: checkin_commit
          changed_when: "'nothing to commit' not in checkin_commit.stdout"
          failed_when: >-
            checkin_commit.rc != 0 and 'nothing to commit' not in checkin_commit.stdout

        - name: Capture the current origin URL
          ansible.builtin.command: git remote get-url origin
          args:
            chdir: "{{ playbook_dir }}"
          register: origin_url
          changed_when: false
          when: checkin_commit.changed

        - name: Push the VLAN workbook update
          when: checkin_commit.changed
          block:
            - name: Set remote URL with credentials for push
              ansible.builtin.command:
                cmd: >-
                  git remote set-url origin
                  {{ origin_url.stdout
                     | regex_replace('^git@([^:]+):(.*)$',
                       'https://' + ansible_env.GIT_USERNAME + ':' + ansible_env.GITHUB_TOKEN + '@\1/\2') }}
                chdir: "{{ playbook_dir }}"
              changed_when: false
              no_log: true

            - name: Push the commit
              ansible.builtin.command:
                cmd: git push origin HEAD
                chdir: "{{ playbook_dir }}"
              no_log: true
          always:
            - name: Restore remote URL without embedded credentials
              ansible.builtin.command:
                cmd: "git remote set-url origin {{ origin_url.stdout }}"
                chdir: "{{ playbook_dir }}"
              changed_when: false
  ### End of GitOps Block
