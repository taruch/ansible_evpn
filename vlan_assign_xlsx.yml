---
# Find the next free VLAN ID and write its assignment into the .xlsx workbook
# in one playbook - merges vlan_next_available_xlsx.yml's "find" logic with
# vlan_add_xlsx.yml's "write" logic. Both of those playbooks stay as-is for
# standalone/manual use (preview what's next, or assign a specific known
# VLAN); this one is for the AAP workflow, where nothing reviews the chosen
# ID in between finding it and writing it, so a separate lookup node would
# just be an extra workflow hop with no purpose.
#
# If vlan_id isn't given, automatically picks the next free VLAN ID in
# vlan_range_start-vlan_range_end: free meaning not already Assignment-ed in
# the spreadsheet AND not in switch_used_vlans, a list fed in as an extra_var
# - in the AAP workflow this arrives as the set_stats artifact from
# vlan_switch_usage.yml, which should run as the node just before this one.
# Pass -e vlan_id=<id> instead to assign a specific VLAN rather than
# auto-picking one.
#
# The DataCenter tab already has one row per VLAN ID (1-4094); "adding" a
# VLAN here means filling in that row's Assignment (and related) columns,
# rather than appending a brand new row.
#
# Requires openpyxl on whichever Python interpreter Ansible uses to run
# modules - locally via `pip install openpyxl`, or via ansible-navigator with
# an execution environment image that includes it, e.g.:
#   ansible-navigator run -mstdout vlan_assign_xlsx.yml \
#     --eei=quay.io/truch/ee_spreasheet:1.2 -e ...
#
# Usage:
#   ansible-playbook vlan_assign_xlsx.yml -e assignment=evpn-tenant3
#   ansible-playbook vlan_assign_xlsx.yml -e vlan_id=1105 -e assignment=evpn-tenant3
#   ansible-playbook vlan_assign_xlsx.yml -e vlan_id=1105 -e assignment=evpn-tenant3 \
#       -e ip_block=172.16.105.0 -e ip_mask=255.255.255.0 -e vrf=evpn-tenant3 \
#       -e ticket=CHG0012345 -e 'comments="Added for new rack"'
#
# Note the quoting on any -e value containing spaces (e.g. comments): Ansible's
# simple key=value extra-vars parser splits on whitespace, so a bare
# -e comments="Added for new rack" silently truncates to "Added". Wrap the
# value in its own quotes as shown above so Ansible sees it as one token.

- name: Find the next available VLAN and assign it in the XLSX workbook
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    xlsx_file: "{{ playbook_dir }}/VLAN-Assignments-TEST-for-Ansible.xlsx"
    tab_name: DataCenter
    vlan_id: ""
    vlan_range_start: 2
    vlan_range_end: 4094
    assignment: ""
    ip_block: ""
    ip_mask: ""
    vrf: ""
    ticket: ""
    comments: ""
    assigned_by: "{{ lookup('env', 'USER') }}"

  tasks:
    - name: Require assignment
      ansible.builtin.assert:
        that: assignment != ""
        fail_msg: >-
          Pass -e assignment=<name> (optionally -e vlan_id=<id> to assign a
          specific VLAN instead of auto-picking the next available one,
          -e ip_block=<ip> -e ip_mask=<mask> -e vrf=<vrf> -e ticket=<ticket#>
          -e comments=<text>)

    - name: Read the current tab
      xls_to_facts:
        src: "{{ xlsx_file }}"
      register: workbook

    - name: Fail if the tab doesn't exist in the workbook
      ansible.builtin.assert:
        that: ('spreadsheet_' + tab_name) in workbook.ansible_facts
        fail_msg: >-
          Tab '{{ tab_name }}' not found in {{ xlsx_file }}. Available tabs:
          {{ workbook.ansible_facts.keys() | map('regex_replace', '^spreadsheet_', '') | list }}

    - name: Select the requested tab
      ansible.builtin.set_fact:
        vlan_rows: "{{ workbook.ansible_facts['spreadsheet_' + tab_name] }}"

    - name: Pick the next available VLAN ID when one wasn't given
      when: vlan_id | string == ''
      block:
        - name: Build the list of VLAN IDs already in use (rows with an Assignment)
          ansible.builtin.set_fact:
            used_vlans: >-
              {{
                vlan_rows
                | rejectattr('Assignment', 'equalto', None)
                | map(attribute='VLAN')
                | select('number')
                | map('int')
                | list
              }}

        - name: Fold in VLAN IDs already configured live on the switches
          ansible.builtin.set_fact:
            used_vlans: "{{ (used_vlans + (switch_used_vlans | default([]))) | unique | list }}"

        - name: Build the list of candidate VLAN IDs still free in the requested range
          ansible.builtin.set_fact:
            available_vlans: >-
              {{
                range(vlan_range_start | int, (vlan_range_end | int) + 1)
                | list
                | difference(used_vlans)
                | sort
              }}

        - name: Fail if the whole range is used up
          ansible.builtin.assert:
            that: available_vlans | length > 0
            fail_msg: >-
              No free VLAN ID between {{ vlan_range_start }} and {{ vlan_range_end }}
              in tab '{{ tab_name }}' - all {{ used_vlans | length }} are in use

        - name: Use the next available VLAN ID
          ansible.builtin.set_fact:
            vlan_id: "{{ available_vlans[0] }}"

    - name: Find the row for this VLAN, if any
      ansible.builtin.set_fact:
        matching_rows: >-
          {{
            vlan_rows
            | selectattr('VLAN', 'equalto', vlan_id | int)
            | list
          }}

    - name: Note any existing assignment for this VLAN
      ansible.builtin.set_fact:
        existing_assignment: "{{ matching_rows[0].Assignment if (matching_rows | length > 0) else '' }}"

    - name: Fail if the VLAN is already assigned
      ansible.builtin.assert:
        that: not existing_assignment
        fail_msg: >-
          VLAN {{ vlan_id }} is already assigned to '{{ existing_assignment }}'
          in tab '{{ tab_name }}' - see vlan_lookup_xlsx.yml -e vlan_id={{ vlan_id }}

    - name: Write the VLAN assignment into the workbook
      xls_set_row:
        src: "{{ xlsx_file }}"
        sheet: "{{ tab_name }}"
        key_column: VLAN
        key_value: "{{ vlan_id | int }}"
        values:
          Used: "Yes"
          Assignment: "{{ assignment }}"
          Date: "{{ ansible_date_time.date }}"
          Assigned By: "{{ assigned_by }}"
          "IP Block": "{{ ip_block }}"
          "IP Mask": "{{ ip_mask }}"
          VRF: "{{ vrf }}"
          "Ticket #": "{{ ticket }}"
          Comments: "{{ comments }}"
      register: result

    - name: Confirm the VLAN was added
      ansible.builtin.debug:
        msg: >-
          VLAN {{ vlan_id }} assigned to '{{ assignment }}' in tab '{{ tab_name }}'
          of {{ xlsx_file }} (changed={{ result.changed }})

    - name: Check the updated workbook into git
      ansible.builtin.import_tasks: gitops_checkin_xlsx.yml
